[project]
name = "observatorio"
version = "0.1.0"
description = "Clio-style privacy-preserving usage insights over WildChat-1M, powered by Qwen."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.3",
    "pyarrow>=18",
    "pytz",
    "numpy>=2.0",
    "tqdm",
    "huggingface-hub",
]

[dependency-groups]
dev = ["ruff>=0.15"]
# GPU stages (extract / embed / label / hierarchy / audit). Pinned to the vLLM
# release already validated on this node for Qwen3.8.
gpu = ["vllm==0.30.0"]
# CPU stages (cluster / project).
cluster = ["scikit-learn>=1.6", "umap-learn>=0.5.12", "joblib"]
# Viewer (observatorio.serve).
serve = ["fastapi", "uvicorn[standard]"]

[tool.uv]
default-groups = ["dev", "gpu", "cluster", "serve"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]
